# meme_trader parameters.
# Copy to config/params.yaml and edit. Values marked TBD are placeholders
# waiting on the owner's starting parameters (see docs/BUILD_LOG.md).

mode: paper            # paper | live   (live also requires env MEME_TRADER_CONFIRM_LIVE=yes)

wallet:
  # Public key only. The private key is NEVER stored in this file:
  # live mode reads a keypair JSON file from env SOLANA_KEYPAIR_PATH.
  pubkey: ""           # TBD

capital:
  starting_sol: 1.0              # TBD - total SOL the bot may use
  per_trade_sol: 0.05            # TBD - SOL spent per entry
  max_open_positions: 3          # TBD
  daily_loss_limit_sol: 0.15     # TBD - halt new entries for the UTC day after this loss
  max_drawdown_pct: 30           # TBD - kill switch: stop everything below this drawdown from start
  min_sol_reserve: 0.02          # always keep this much SOL for fees/rent

safety:                          # Safety agent: hard gates, any failure = reject
  require_mint_authority_revoked: true
  require_freeze_authority_revoked: true
  max_rugcheck_score: 1000       # TBD - RugCheck normalised risk score (lower is safer)
  reject_danger_risks: true      # reject if RugCheck lists any "danger" level risk
  min_liquidity_usd: 15000       # TBD
  max_top10_holder_pct: 35       # TBD
  max_single_holder_pct: 10      # TBD
  min_holders: 150               # TBD
  min_token_age_minutes: 10      # TBD - skip the first minutes after launch
  max_token_age_hours: 72        # TBD
  min_lp_locked_pct: 80          # TBD - share of LP burned/locked
  max_roundtrip_loss_pct: 8      # honeypot test: buy->sell quote must not lose more than this

analyst:                         # Analyst agent: soft scoring, 0-100
  min_volume_5m_usd: 5000        # TBD
  min_buy_sell_ratio_5m: 1.2     # TBD
  min_price_change_5m_pct: 2     # TBD
  max_price_change_1h_pct: 300   # TBD - don't chase vertical candles
  min_score: 60                  # TBD - minimum score to pass to Risk

execution:
  slippage_bps: 300              # TBD - 3%
  max_price_impact_pct: 3        # TBD
  priority_fee_lamports: 100000  # TBD
  paper_fee_pct: 1.0             # simulated round-trip fees+slippage for paper fills

exits:                           # Monitor agent
  stop_loss_pct: 20              # TBD
  take_profit_ladder:            # TBD - sell fraction of the ORIGINAL size at each gain level
    - {gain_pct: 50,  sell_fraction: 0.5}
    - {gain_pct: 150, sell_fraction: 0.25}
  trailing_stop_pct: 25          # TBD - from peak, after first TP hit
  max_hold_minutes: 240          # TBD

scout:
  sources: [dexscreener_profiles, dexscreener_boosts]
  max_candidates_per_cycle: 30

loop:
  poll_seconds: 20
  cooldown_minutes_after_exit: 120   # don't re-enter the same mint right away

# ---------------------------------------------------------------------------
# Pump.fun early-entry sniper  (python -m meme_trader.sniper ...)
# Strategy notes and rationale: docs/STRATEGY.md
# ---------------------------------------------------------------------------
sniper:
  capital:
    starting_sol: 1.0            # TBD - paper/live budget for the sniper
    buy_sol: 0.05                # TBD - SOL per entry
    max_open_positions: 4        # TBD
    daily_loss_limit_sol: 0.2    # TBD
    max_drawdown_pct: 30         # TBD - kill switch (sells everything, stops entries)
    min_sol_reserve: 0.03        # never spend below this much SOL (fees, rent, exits)

  sizing:                        # sizing agent (intel §5): $ per buy from signal strength
    enabled: true
    base_usd: 5                  # anything that passes the full filter stack
    max_usd: 20                  # HARD cap per buy, enforced in code
    copy_multiplier: 0.6         # copies are entered later than the leader -> smaller
    max_pct_of_curve_sol: 3      # never more than this % of the SOL in the curve (price impact)
    sol_usd_fallback: 150        # TBD - used until/if the live SOL price can't be fetched

  entry:
    enabled: true                # sniper entries on/off (copy, callouts and late plays have their own switches)
    bundle_window_s: 2           # buys this soon after create count as bundled/insider snipes
    min_age_s: 15                # TBD - wait at least this long before buying (let insiders show their hand)
    max_age_s: 240               # TBD - stop watching a launch after this
    min_curve_progress_pct: 4    # TBD
    max_curve_progress_pct: 40   # TBD - later than this is no longer "early"
    max_dev_buy_pct: 6           # TBD - dev's initial buy, % of supply
    max_bundle_pct: 15           # TBD - supply taken by non-dev wallets in the bundle window
    max_early_sold_ratio: 0.35   # reject if early buyers already sold this share of their bag
    max_top10_pct: 35            # TBD - top 10 wallets (excl. curve) % of supply
    max_creator_launches_24h: 2  # serial deployers are farming, not building
    max_symbol_dupes_1h: 3       # copycat tickers
    min_unique_buyers: 15        # TBD
    flow_window_s: 20            # seconds of trades used for the net-inflow check
    min_net_flow_sol: 1.0        # TBD - net SOL into the curve over flow_window_s
    full_marks_buyers: 20        # unique buyers in flow window for full velocity score
    full_marks_flow_sol: 5       # net inflow (SOL) that earns the full flow score
    min_score: 55                # TBD
    min_fees_paid_sol: 0.1       # real buyers pay fees; bundle rugs barely do (intel: 0.1 degen / 1-3 SOL later tabs)
    sniper_window_s: 10          # buys this soon after launch count as snipes
    max_sniper_pct: 20           # snipers still holding > this % of supply -> wait (intel: Turtle's audit)
    max_insider_pct: 30          # dev + bundle wallets still holding > this % -> wait
    funding:                     # insider clusters via the wallet funding graph (sniper/funding.py)
      enabled: true              # look up who funded early buyers to spot insider clusters
      backend: rpc               # rpc = any SOLANA_RPC_URL (cheap) | helius = HELIUS_API_KEY funded-by (paid, labels exchanges)
      cohort_size: 20            # first N buyers (+ current top 10) are checked
      max_cluster_pct: 15        # reject if dev-/co-funded early wallets still hold more than this % of supply
      max_cluster_pct_hold: 20   # while holding: exit if the linked cluster grows past this
      exchange_fanout: 50        # a funder seen funding this many wallets is treated as an exchange, not a link
      max_wait_s: 6              # don't hold an entry longer than this waiting for lookups
      max_lookups_per_min: 240   # cost guard
    require_socials: false       # TBD - require twitter/telegram/website in metadata
    allow_unknown_launch: false  # allow entries on CAs we only saw via social signals

  exit:
    profile: trail               # trail = initials at 2x + tightening trailing stop | ladder = fixed ladder below
    ladder:                      # David's rules: 2x sell half, 5x sell rest, 0.3x stop; ratchet after 3x
      steps: [{at_x: 2, sell_frac: 0.5}, {at_x: 5, sell_frac: 1.0}]
      stop_x: 0.3                # ladder profile: sell everything below this multiple of entry (0.3 = -70%)
      trail_after_x: 3           # once 3x was reached, never let it round-trip back to entry
      trail_pct: 30              # ladder profile: trailing stop % off the peak after the last rung
    initials_at_pct: 100         # TBD - at 2x, sell enough to recover cost
    initials_multiple: 1.0       # 1.0 = exactly cost; 1.2 = cost + 20%
    trail_tiers:                 # TBD - trailing stop from peak, tightens as gain grows
      - {above_gain_pct: 30,  trail_pct: 30}
      - {above_gain_pct: 150, trail_pct: 25}
      - {above_gain_pct: 400, trail_pct: 20}
      - {above_gain_pct: 1000, trail_pct: 15}
    stop_loss_pct: 30            # TBD
    decay_window_s: 15           # seconds of trades the momentum-decay exit looks at
    decay_net_outflow_sol: 1.5   # net SOL leaving the curve in decay_window_s ...
    decay_min_drop_pct: 12       # ... while price is this far off the peak -> exit
    stall_s: 90                  # in profit but no new high for this long -> exit
    no_progress_s: 60            # never got above +no_progress_min_gain_pct in this time -> exit
    no_progress_min_gain_pct: 10 # gain (%) a position must reach within no_progress_s to stay
    max_hold_s: 1800             # sell anything held longer than this (seconds)
    exit_at_curve_progress_pct: 92   # sell before migration (post-graduation dumps are common)
    exit_on_dev_sell: true       # sell everything when the creator sells

  execution:
    curve_fee_pct: 1.25          # pump.fun bonding-curve fee (protocol + creator)
    platform_fee_pct: 0.5        # PumpPortal local-trade API fee
    paper_latency_slippage_pct: 3   # paper: extra adverse price move between signal and landing
    paper_delay_s: 0             # paper: seconds from deciding to landing; orders fill at the curve price THEN, and buys
                                 # fail (fee paid) past slippage_pct, sells retry through sell_slippage_steps, like live.
                                 # Realistic: feed lag behind the chain (dashboard) + ~1 s to land. With it, set
                                 # paper_latency_slippage_pct to 0 - the delay itself is the slippage.
    slippage_pct: 15             # live: max buy slippage sent to PumpPortal (buys are never blindly retried)
    sell_slippage_steps: [15, 25, 40]   # live sells: re-quote with these slippages until one lands
    urgent_sell_slippage_steps: [15, 25, 40]   # ... for exits on a falling price (dev sold, stops, momentum decay, insider
                                 #   cluster, trailing stops, kill switch). Replayed 2026-10-05 (24 h, 136 graduation trades):
                                 #   [30,60,95] -0.94 and [50,80,95] -0.92 vs [15,25,40] -0.79 SOL: wider didn't help
    close_empty_accounts: true   # live: close emptied token accounts after a full exit (reclaims rent)
    verify_tx: true              # live: simulate each PumpPortal-built transaction before signing and refuse it
                                 # if it would move more of our SOL than the order allows (adds ~2 RPC calls)
    priority_fee_sol: 0.001      # buys (2026 norms: ~0.001-0.005 SOL; a pump.fun buy is ~250k CU)
    sell_priority_fee_steps: [0.001, 0.003, 0.008]   # sells escalate with each re-quote (dumps are congested)

  signals:
    telegram_channels: []        # TBD - channel usernames/ids to watch for CAs (needs TG API id/hash)
    x_accounts: []               # TBD - X accounts to watch (needs X API bearer token)
    social_only_watch: true      # start tracking a CA we first saw in a post

  copy:                          # copy trading (needs PUMPPORTAL_API_KEY for wallet streams)
    enabled: true
    leaders: []                  # TBD - [{address: ..., label: ..., mode: mirror|signal}]  (find candidates: `leaders` command, kolscan.io, gmgn.ai)
    buy_sol: 0.05                # TBD - SOL per copied entry
    min_leader_buy_sol: 0.5      # ignore the leader's small test buys
    max_chase_pct: 25            # skip if price is already this far above the leader's fill
    max_curve_progress_pct: 70   # don't copy into a curve fuller than this %
    max_copies_per_leader_per_hour: 6  # cap on copies of one leader per hour
    apply_red_flags: true        # still refuse dev-sold / bundled / serial-deployer tokens
    follow_sells: true           # mirror the leader's sells
    sell_all_when_leader_sold_pct: 50   # leader dumps >= this share of their bag -> we exit fully
    use_own_exits: true          # also apply our stop loss / initials / trailing stop
    pause_after_losses: 5        # auto-pause a leader after N copied losses in a row

  manual:                        # your own trades from the dashboard: Buy / add / sell 25-50% / Initials / Exit
    max_sol: 2.0                 # largest single manual buy
    presets_sol: [0.05, 0.1, 0.25, 0.5, 1.0]
    stop_loss_pct: 0             # automatic stop for manual positions; 0 = off (you manage it)
    take_profit_pct: 0           # sell take_profit_frac at this gain; 0 = off
    take_profit_frac: 0.5        # share of the bag sold at that take profit
    trail_pct: 0                 # once in profit, sell everything this far below the peak; 0 = off
    sell_on_dev_sell: false      # sell everything if the coin's creator sells after you bought (each position can override)
    sell_on_graduation: true     # live only: exit when a coin migrates (its price then updates every 10 s); paper keeps it
    queue_s: 60                  # a coin with no live price yet: buy it when its first trade shows up, within this
  desk:                          # AI trading desk (Claude persona agents vote on entries; needs ANTHROPIC_API_KEY)
    enabled: false               # TBD - turn on once the key is set
    model: claude-opus-5-5
    effort: low                  # low keeps votes to a few seconds
    personas: [veteran, narrative, skeptic, quant]
    weights: {veteran: 1.0, narrative: 0.8, skeptic: 1.0, quant: 1.0}
    quorum: 0.45                 # share of the desk's voting weight that must vote buy (a buy under 50 conviction counts half)
    veto_conviction: 75          # skeptic "pass" at/above this conviction vetoes the trade
    timeout_s: 12
    max_price_move_pct: 20       # skip if price ran this much while the desk deliberated
    price_in_per_mtok: 4.0       # for the cost meter on the dashboard (USD)
    price_out_per_mtok: 20.0
    provider: anthropic          # anthropic | github | huggingface | openrouter | local (Desk -> AI desk model)
    base_url: ""                 # other providers: their server (blank = the provider's default)
    other_price_in_per_mtok: 0   # other providers: $ per million tokens, looked up when you pick a model
    other_price_out_per_mtok: 0
    huddle_minutes: 30           # the team meets this often while the desk is awake (one model call, ~1¢ on Sonnet); 0 = only on request
    note_replies: true           # every persona reads each note you save (Teach the desk) and replies; 4 calls a note
    note_effort: low             # thinking effort for those replies
    graduation_vote: true        # the team decides graduation buys. false: the rules decide and the team votes on the
                                 #   side; every vote is still scored (Analytics -> The AI team's record)
    practice: true               # with graduation plays off, the team still votes on what the rules pick: nothing is
                                 #   bought, each call is followed on the bot's exits and scored. Each vote is 4 model calls

  callouts:                      # pump.fun callouts: hold the $1 minimum, post a factual card, track results
    enabled: true
    interval_s: 120              # platform allows one callout per 2 minutes
    max_per_day: 200             # most callouts in a UTC day
    position_usd: 1.10           # buy slightly over $1 so the bag stays >= $1 after fees
    priority_fee_sol: 0.00005    # a $1 bag is never urgent: minimal priority (fees would eat ~25% of it otherwise)
    min_hold_usd: 1.0            # platform minimum to call out
    max_open_bags: 40            # most $1 bags held at once
    hold_s: 3600                 # keep the bag 1h (exit earlier only if the dev sells)
    min_age_s: 60                # token must be at least this old (seconds)
    max_age_s: 1800              # and at most this old (seconds)
    min_curve_pct: 20            # coins people click: visibly filling but not about to migrate
    max_curve_pct: 85            # curve no fuller than this % (not about to migrate)
    min_holders: 30              # at least this many holders
    min_new_buyers_per_min: 10   # at least this many new buyers per minute
    max_top10_pct: 35            # top 10 holders may hold at most this % of supply
    min_score: 45                # clickability score (holder growth, inflow, curve, smart wallets, near high)
    auto_post: none              # none = dashboard Copy/Open buttons | telegram = also post to TELEGRAM_CHANNEL_ID

  notify:                        # phone alerts (TELEGRAM_BOT_TOKEN + TELEGRAM_ALERT_CHAT_ID in .env)
    levels: [buy, close, error, digest]   # any of: buy, sell, close, callout, error, signal, desk, info, digest (the day's summary)

  feed:
    trades: solana               # solana = read trades from pump.fun's on-chain logs (no per-trade fee)
                                 # pumpportal = PumpPortal token-trade stream (0.01 SOL / 10k trades, key + funded wallet)
    ws_url: ""                   # solana only: endpoint(s), comma-separated or a list, tried in order; empty =
                                 # SOLANA_WS_URL from .env. PublicNode and the public RPC are always added as fallbacks
    commitment: confirmed        # solana only: confirmed = complete; processed is ~0.5 s sooner but can miss trades
    max_gap_pct: 5               # watchdog: more trades missing than this (live reserve-chain check) = switch endpoint
    stall_s: 60                  # watchdog: no pump.fun trade decoded for this long = switch endpoint
    max_lag_s: 5                 # watchdog: median trade arrives this many seconds after it happened on chain = switch
                                 # (measured 2026-10-03: PublicNode 12 s behind, public RPC 1-2 s; 0 = off)
    fallback_ws_urls: ["wss://pumpdev.io/ws"]   # backup launch feed if PumpPortal drops (entries pause while on it)
    backup_ws_url: ""            # a metered trade-log websocket used only while the free ones are down or behind;
                                 # empty = SOLANA_WS_BACKUP_URL, else your HELIUS_API_KEY's websocket
    backup_mb_per_day: 1200      # its allowance fills at this rate (Helius bills 2 credits / 0.1 MB, so 1200 MB/day
                                 # ≈ 720k of the free plan's 1M credits a month). 0 = never use it
    backup_bank_mb: 4800         # ... and saves up to this much, so a bad night (the stream runs 400-800 MB/h) can
                                 # use what quiet days didn't

  risk:                          # the risk dial: scales trade size, open positions and the daily loss limit
    level: 2                     # 1 Cautious x0.5 | 2 Normal = the settings above | 3 Bold x1.5 | 4 Aggressive x2 | 5 Max x3
    max_level: 5                 # the highest level anyone can turn it to - you, or Claude with your approval
                                 # (kill switch, stop losses, entry rules and the 3%-of-curve cap never change)

  market:                        # how trades are read
    non_organic_wallets:         # their trades move the price, but never count as demand, buyers or holders
      - BwWK17cbHxwWBKZkUYvzxLcNQ1YVyaFezduWbtm2de6s   # pump.fun's Mayhem-mode AI agent: ~22% of all trades (2026-10-03)

  agent:                         # AI operator tools (Claude Code via MCP: see .mcp.json and CLAUDE.md)
    enabled: true                # local-only API at /api/agent, secret token in data/agent.token
    can_buy: true                # may the agent open positions itself (always within the limits below)
    max_buy_usd: 0               # per agent buy; 0 = same as sizing.max_usd
    max_buys_per_hour: 6
    max_actions_per_min: 20
    max_deposit_sol: 100         # paper only: most pretend SOL one deposit may add (the agent asks via add_paper_funds)
    # The agent may LOWER any risk setting and pause, but never raise sizing, positions, loss limit or
    # stop loss above what's configured here, re-enable a strategy that's off here, switch to live,
    # save risk settings, or press the kill switch. Its actions are journaled with its reasons.

  chat:                          # the dashboard's Chat tab: Claude Code (claude -p) on your Claude plan, no API key
    enabled: true                # needs agent.enabled and Claude Code installed and logged in
    model: ""                    # "" = your Claude Code default | opus | sonnet | haiku (also switchable in the tab)
    ask_first: true              # every action waits for Approve / Decline in the dashboard (reads never do)
    auto_read_ca: true           # a pasted contract address gets its metrics card AND Claude's read
    claude_bin: ""               # path to the claude binary; "" = find it on PATH or in ~/.local/bin
    timeout_s: 600               # longest one answer may take
    approval_timeout_s: 600      # an unanswered approval is declined after this

  late:                          # "graduation play": strong late-curve momentum, out before migration
    enabled: true                # on in paper to gather evidence; check its row in Analytics > By strategy before live
    buy_usd_mult: 1.0            # size relative to the sizing agent's normal answer
    min_curve_pct: 55            # window start: curve at least this % full
    max_curve_pct: 85            # window end: curve at most this % full
    max_age_s: 900               # token at most this old (seconds)
    min_age_s: 0                 # ... and at least this old (0 = off). Dumps were younger at entry (median 20 s vs 31 s)
    max_dev_sold_pct: 0          # skip coins whose creator has sold more than this % of the supply (0 = any sale skips;
                                 #   the lab can test letting them through). A held coin still sells if the creator
                                 #   sells again after the buy
    min_recent_sells: 0          # skip when the last 20 s had fewer sells than this (0 = off): heavy buying with nobody
                                 #   selling was the dump profile (2026-10-05 replays of 3 days, 322 trades; see BUILD_LOG #49)
    flow_window_s: 30            # seconds of trades the momentum checks look at
    min_net_flow_sol: 3.0        # net SOL into the curve in flow_window_s
    min_buyers: 12               # unique buyers in flow_window_s
    min_buy_sell_ratio: 1.5      # buys / sells in flow_window_s at least this
    min_near_high: 0.9           # price within 10% of its high
    scan_interval_s: 2           # how often candidates are checked (research varies it: results shouldn't hinge on it)
    entry_mode: rule             # rule = the conditions above | window = research baseline: every token entering the
                                 # curve window that passes the red-flag checks, no momentum condition
    exit_curve_pct: 94           # sell into the run-up, before migration (post-graduation liquidity drops ~57% in 25 min)
    stop_loss_pct: 15            # graduation-play stop loss (%)
    stall_s: 45                  # sell if no new high for this long while held (seconds)
    max_hold_s: 600              # sell after this long regardless (seconds)
    runner_after_pct: 0          # once a play has been up this much, let it run: momentum decay and the stall stop
                                 #   selling it and a trailing stop takes over (0 = off; the lab can test it)
    runner_trail_pct: 25         # ... the runner's trailing stop: sell this far under its peak

  predict:                       # learned probability model: `train` writes a candidate, `promote` deploys it
    enabled: true                # used only once a PROMOTED model file exists
    display_only: true           # true = P(2x) is shown but never changes a trade (no gate, no sizing).
                                 # Set false only after a sweep/compare on recorded data shows it helps.
    model_path: data/model.json
    up_pct: 100                  # label: did price reach +100% (2x) ...
    down_pct: 30                 # ... before -30% ...
    horizon_s: 600               # ... within 10 minutes of the snapshot
    checkpoints_s: [15, 30, 60, 120, 180]
    min_p: 0.0                   # entry gate on P(2x first) (needs display_only: false)
    kelly_fraction: 0.25         # quarter-Kelly into the sizing agent's strength (needs display_only: false)
    require_positive_ev: false   # skip entries the model says lose money after costs (needs display_only: false)

  lab:                           # the team's lab: one setting at a time replayed on the last 24 h of recordings
    enabled: true                #   (a separate low-priority process; results go to the next huddle)
    auto_every_min: 360          # with nothing queued, the team tests a routine one-step change this often
    max_per_day: 4               # tests started in any 24 h (each replays the last 24 h twice, at low priority)
    min_free_mb: 8000            # start a test only with this much memory free
    detach: true                 # run each test as its own short-lived user service (survives bot restarts)
    memory_max_mb: 6000          # ... capped at this much memory
    days: 5                      # each test replays this many recent completed days, one at a time (the current
                                 #   settings' replay of a day is kept and reused: about 10 min a day per test after that)
    timeout_min: 180             # stop a test that runs longer than this

  xchain:                        # paper trading on other chains: young DEX coins (sniper/xchain.py). Paper only.
    enabled: true
    chains: [bsc, base, solana]  # bsc, base, eth, solana (Solana DEX coins outside the pump.fun curve)
    poll_s: 5                    # live prices for held coins this often (a router quote; DexScreener as fallback)
    scan_s: 90                   # look for new candidates this often (GeckoTerminal trending + new pools)
    max_open: 4                  # other-chain positions at once
    size_usd: 0                  # per trade; 0 = the risk dial's sizing.base_usd
    min_liq_usd: 20000           # pool liquidity (smaller pools: big price impact, easy to pull)
    min_vol_h1_usd: 20000        # traded in the last hour
    min_age_min: 15              # pool at least this old ...
    max_age_h: 168               # ... and at most this old (a week: still a young memecoin)
    min_mcap_usd: 50000          # market cap at least this ...
    max_mcap_usd: 20000000       # ... and at most this (memecoins, not majors)
    min_buy_ratio: 1.0           # buys / sells in the last hour (1 = more buys than sells)
    min_chg_h1: 5                # up at least this much in the last hour ...
    max_chg_h1: 150              # ... but not already gone vertical
    max_tax_pct: 5               # token buy/sell tax (honeypot.is; Solana transfer fee)
    stop_loss_pct: 15            # sell everything this far under the entry price
    take_profit_pct: 40          # sell take_profit_fraction here
    take_profit_fraction: 0.5    # share of the coins sold at the take profit
    trail_after_pct: 20          # once up this much, a trailing stop ...
    trail_pct: 20                # ... this far under the peak sells the rest
    max_hold_h: 6                # sell whatever is left after this long
    cooldown_h: 6                # don't buy the same coin again for this long
    extra_slip_pct: 0.5          # per fill, on top of fee, price impact and tax (quote-to-fill delay)
    gas_usd: {bsc: 0.05, base: 0.02, eth: 1.5, solana: 0.01}   # network fee per swap, in dollars

  risk_adapt:                    # defensive mode after a bad run (equity-curve risk control)
    enabled: true
    lookback_trades: 10          # how many recent trades defense mode looks at
    loss_streak: 5               # N losses in a row ...
    window_loss_sol: 0.15        # ... or the last lookback_trades lost more than this
    size_mult: 0.5               # while defensive: half size ...
    min_score_add: 10            # ... and a higher bar
    minutes: 30                  # how long defense mode lasts

  audit:
    window_s: 600                # follow every decision 10 min: had we bought, would it double before -30%? (vs our buys)

  record:
    full_window_s: 600           # while recording, keep every launch's trades for 10 min (unbiased backtests)

# ---------------------------------------------------------------------------------------------------------
# Wallet study recorder: python -m meme_trader.wallets record (docs/WALLETS.md). Paper research only.
wallets:
  mode: poll                     # poll = discovery samples + GeckoTerminal (~3.5 GB/day, partial on the busiest pools)
                                 # stream = the whole PumpSwap stream, complete (~80 GB/day download)
  min_pool_age_days: 2           # record trades on pump.fun coins' PumpSwap pools at least this old (younger = ~90% of trades)
  min_liquidity_usd: 5000        # ...with at least this much liquidity
  keep_days: 10                  # stop polling a pool after this long without a trade (rediscovery restarts it)
  max_pools: 4000
  discover_s: 45                 # sample the whole PumpSwap stream this long (~0.9 MB/s while sampling) ...
  discover_every_s: 900          # ... this often, to find which pools are trading (~3.5 GB/day)
  gt_calls_per_min: 5            # GeckoTerminal's free API sustains ~5 (measured; bursts above get 429)
  target_trades_per_poll: 250    # poll a busy pool often enough that one call (max 300 trades) doesn't overflow
  min_poll_s: 60
  max_poll_s: 72000              # 20 h: GeckoTerminal keeps 24 h of trades
  deep_min_usd: 25               # a busy pool's first poll also fetches its last 300 trades over $25 (further back)
  meta_refresh_s: 21600          # liquidity snapshot per pool this often
  candles_every_s: 300           # daily candles: one pool per this many seconds ...
  candles_min_age_days: 13       # ... for pools nearly old enough to signal ...
  candles_refresh_days: 7        # ... refreshed this often
