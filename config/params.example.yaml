# meme_trader parameters.
# Copy to config/params.yaml and edit. Values marked TBD are placeholders
# waiting on the owner's starting parameters (see docs/BUILD_LOG.md).

mode: paper            # paper | live   (live also requires env MEME_TRADER_CONFIRM_LIVE=yes)

wallet:
  # Public key only. The private key is NEVER stored in this file:
  # live mode reads a keypair JSON file from env SOLANA_KEYPAIR_PATH.
  pubkey: ""           # TBD

capital:
  starting_sol: 1.0              # TBD - total SOL the bot may use
  per_trade_sol: 0.05            # TBD - SOL spent per entry
  max_open_positions: 3          # TBD
  daily_loss_limit_sol: 0.15     # TBD - halt new entries for the UTC day after this loss
  max_drawdown_pct: 30           # TBD - kill switch: stop everything below this drawdown from start
  min_sol_reserve: 0.02          # always keep this much SOL for fees/rent

safety:                          # Safety agent: hard gates, any failure = reject
  require_mint_authority_revoked: true
  require_freeze_authority_revoked: true
  max_rugcheck_score: 1000       # TBD - RugCheck normalised risk score (lower is safer)
  reject_danger_risks: true      # reject if RugCheck lists any "danger" level risk
  min_liquidity_usd: 15000       # TBD
  max_top10_holder_pct: 35       # TBD
  max_single_holder_pct: 10      # TBD
  min_holders: 150               # TBD
  min_token_age_minutes: 10      # TBD - skip the first minutes after launch
  max_token_age_hours: 72        # TBD
  min_lp_locked_pct: 80          # TBD - share of LP burned/locked
  max_roundtrip_loss_pct: 8      # honeypot test: buy->sell quote must not lose more than this

analyst:                         # Analyst agent: soft scoring, 0-100
  min_volume_5m_usd: 5000        # TBD
  min_buy_sell_ratio_5m: 1.2     # TBD
  min_price_change_5m_pct: 2     # TBD
  max_price_change_1h_pct: 300   # TBD - don't chase vertical candles
  min_score: 60                  # TBD - minimum score to pass to Risk

execution:
  slippage_bps: 300              # TBD - 3%
  max_price_impact_pct: 3        # TBD
  priority_fee_lamports: 100000  # TBD
  paper_fee_pct: 1.0             # simulated round-trip fees+slippage for paper fills

exits:                           # Monitor agent
  stop_loss_pct: 20              # TBD
  take_profit_ladder:            # TBD - sell fraction of the ORIGINAL size at each gain level
    - {gain_pct: 50,  sell_fraction: 0.5}
    - {gain_pct: 150, sell_fraction: 0.25}
  trailing_stop_pct: 25          # TBD - from peak, after first TP hit
  max_hold_minutes: 240          # TBD

scout:
  sources: [dexscreener_profiles, dexscreener_boosts]
  max_candidates_per_cycle: 30

loop:
  poll_seconds: 20
  cooldown_minutes_after_exit: 120   # don't re-enter the same mint right away

# ---------------------------------------------------------------------------
# Pump.fun early-entry sniper  (python -m meme_trader.sniper ...)
# Strategy notes and rationale: docs/STRATEGY.md
# ---------------------------------------------------------------------------
sniper:
  capital:
    starting_sol: 1.0            # TBD - paper/live budget for the sniper
    buy_sol: 0.05                # TBD - SOL per entry
    max_open_positions: 4        # TBD
    daily_loss_limit_sol: 0.2    # TBD
    max_drawdown_pct: 30         # TBD - kill switch (sells everything, stops entries)
    min_sol_reserve: 0.03

  sizing:                        # sizing agent (intel §5): $ per buy from signal strength
    enabled: true
    base_usd: 5                  # anything that passes the full filter stack
    max_usd: 20                  # HARD cap per buy, enforced in code
    copy_multiplier: 0.6         # copies are entered later than the leader -> smaller
    max_pct_of_curve_sol: 3      # never more than this % of the SOL in the curve (price impact)
    sol_usd_fallback: 150        # TBD - used until/if the live SOL price can't be fetched

  entry:
    bundle_window_s: 2           # buys this soon after create count as bundled/insider snipes
    min_age_s: 15                # TBD - wait at least this long before buying (let insiders show their hand)
    max_age_s: 240               # TBD - stop watching a launch after this
    min_curve_progress_pct: 4    # TBD
    max_curve_progress_pct: 40   # TBD - later than this is no longer "early"
    max_dev_buy_pct: 6           # TBD - dev's initial buy, % of supply
    max_bundle_pct: 15           # TBD - supply taken by non-dev wallets in the bundle window
    max_early_sold_ratio: 0.35   # reject if early buyers already sold this share of their bag
    max_top10_pct: 35            # TBD - top 10 wallets (excl. curve) % of supply
    max_creator_launches_24h: 2  # serial deployers are farming, not building
    max_symbol_dupes_1h: 3       # copycat tickers
    min_unique_buyers: 15        # TBD
    flow_window_s: 20
    min_net_flow_sol: 1.0        # TBD - net SOL into the curve over flow_window_s
    full_marks_buyers: 20        # unique buyers in flow window for full velocity score
    full_marks_flow_sol: 5
    min_score: 55                # TBD
    min_fees_paid_sol: 0.1       # real buyers pay fees; bundle rugs barely do (intel: 0.1 degen / 1-3 SOL later tabs)
    sniper_window_s: 10          # buys this soon after launch count as snipes
    max_sniper_pct: 20           # snipers still holding > this % of supply -> wait (intel: Turtle's audit)
    max_insider_pct: 30          # dev + bundle wallets still holding > this % -> wait
    funding:                     # insider clusters via the wallet funding graph (sniper/funding.py)
      enabled: true
      backend: rpc               # rpc = any SOLANA_RPC_URL (cheap) | helius = HELIUS_API_KEY funded-by (paid, labels exchanges)
      cohort_size: 20            # first N buyers (+ current top 10) are checked
      max_cluster_pct: 15        # reject if dev-/co-funded early wallets still hold more than this % of supply
      max_cluster_pct_hold: 20   # while holding: exit if the linked cluster grows past this
      exchange_fanout: 50        # a funder seen funding this many wallets is treated as an exchange, not a link
      max_wait_s: 6              # don't hold an entry longer than this waiting for lookups
      max_lookups_per_min: 240   # cost guard
    require_socials: false       # TBD - require twitter/telegram/website in metadata
    allow_unknown_launch: false  # allow entries on CAs we only saw via social signals

  exit:
    profile: trail               # trail = initials at 2x + tightening trailing stop | ladder = fixed ladder below
    ladder:                      # David's rules: 2x sell half, 5x sell rest, 0.3x stop; ratchet after 3x
      steps: [{at_x: 2, sell_frac: 0.5}, {at_x: 5, sell_frac: 1.0}]
      stop_x: 0.3
      trail_after_x: 3           # once 3x was reached, never let it round-trip back to entry
      trail_pct: 30
    initials_at_pct: 100         # TBD - at 2x, sell enough to recover cost
    initials_multiple: 1.0       # 1.0 = exactly cost; 1.2 = cost + 20%
    trail_tiers:                 # TBD - trailing stop from peak, tightens as gain grows
      - {above_gain_pct: 30,  trail_pct: 30}
      - {above_gain_pct: 150, trail_pct: 25}
      - {above_gain_pct: 400, trail_pct: 20}
      - {above_gain_pct: 1000, trail_pct: 15}
    stop_loss_pct: 30            # TBD
    decay_window_s: 15
    decay_net_outflow_sol: 1.5   # net SOL leaving the curve in decay_window_s ...
    decay_min_drop_pct: 12       # ... while price is this far off the peak -> exit
    stall_s: 90                  # in profit but no new high for this long -> exit
    no_progress_s: 60            # never got above +no_progress_min_gain_pct in this time -> exit
    no_progress_min_gain_pct: 10
    max_hold_s: 1800
    exit_at_curve_progress_pct: 92   # sell before migration (post-graduation dumps are common)
    exit_on_dev_sell: true

  execution:
    curve_fee_pct: 1.25          # pump.fun bonding-curve fee (protocol + creator)
    platform_fee_pct: 0.5        # PumpPortal local-trade API fee
    paper_latency_slippage_pct: 3   # paper: extra adverse price move between signal and landing
    slippage_pct: 15             # live: max buy slippage sent to PumpPortal (buys are never blindly retried)
    sell_slippage_steps: [15, 25, 40]   # live sells: re-quote with these slippages until one lands
    close_empty_accounts: true   # live: close emptied token accounts after a full exit (reclaims rent)
    priority_fee_sol: 0.0005     # TBD

  signals:
    telegram_channels: []        # TBD - channel usernames/ids to watch for CAs (needs TG API id/hash)
    x_accounts: []               # TBD - X accounts to watch (needs X API bearer token)
    social_only_watch: true      # start tracking a CA we first saw in a post

  copy:                          # copy trading (needs PUMPPORTAL_API_KEY for wallet streams)
    enabled: true
    leaders: []                  # TBD - [{address: ..., label: ..., mode: mirror|signal}]  (find candidates: `leaders` command, kolscan.io, gmgn.ai)
    buy_sol: 0.05                # TBD - SOL per copied entry
    min_leader_buy_sol: 0.5      # ignore the leader's small test buys
    max_chase_pct: 25            # skip if price is already this far above the leader's fill
    max_curve_progress_pct: 70
    max_copies_per_leader_per_hour: 6
    apply_red_flags: true        # still refuse dev-sold / bundled / serial-deployer tokens
    follow_sells: true           # mirror the leader's sells
    sell_all_when_leader_sold_pct: 50   # leader dumps >= this share of their bag -> we exit fully
    use_own_exits: true          # also apply our stop loss / initials / trailing stop
    pause_after_losses: 5        # auto-pause a leader after N copied losses in a row

  desk:                          # AI trading desk (Claude persona agents vote on entries; needs ANTHROPIC_API_KEY)
    enabled: false               # TBD - turn on once the key is set
    model: claude-opus-5-5
    effort: low                  # low keeps votes to a few seconds
    personas: [veteran, narrative, skeptic, quant]
    weights: {veteran: 1.0, narrative: 0.8, skeptic: 1.0, quant: 1.0}
    quorum: 0.45                 # weighted buy-conviction share needed to approve
    veto_conviction: 75          # skeptic "pass" at/above this conviction vetoes the trade
    timeout_s: 12
    max_price_move_pct: 20       # skip if price ran this much while the desk deliberated
    price_in_per_mtok: 4.0       # for the cost meter on the dashboard (USD)
    price_out_per_mtok: 20.0

  callouts:                      # pump.fun callouts: hold the $1 minimum, post a factual card, track results
    enabled: true
    interval_s: 120              # platform allows one callout per 2 minutes
    max_per_day: 200
    position_usd: 1.10           # buy slightly over $1 so the bag stays >= $1 after fees
    min_hold_usd: 1.0            # platform minimum to call out
    max_open_bags: 40
    hold_s: 3600                 # keep the bag 1h (exit earlier only if the dev sells)
    min_age_s: 60
    max_age_s: 1800
    min_curve_pct: 20            # coins people click: visibly filling but not about to migrate
    max_curve_pct: 85
    min_holders: 30
    min_new_buyers_per_min: 10
    max_top10_pct: 35
    min_score: 45                # clickability score (holder growth, inflow, curve, smart wallets, near high)
    auto_post: none              # none = dashboard Copy/Open buttons | telegram = also post to TELEGRAM_CHANNEL_ID

  notify:                        # phone alerts (TELEGRAM_BOT_TOKEN + TELEGRAM_ALERT_CHAT_ID in .env)
    levels: [buy, close, error]  # any of: buy, sell, close, callout, error, signal, desk, info

  feed:
    fallback_ws_urls: ["wss://pumpdev.io/ws"]   # backup launch feed if PumpPortal drops (entries pause while on it)

  record:
    full_window_s: 600           # while recording, keep every launch's trades for 10 min (unbiased backtests)
